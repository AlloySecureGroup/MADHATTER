services:
  madhatter-lab:
    build: .
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /data/hf-cache
      ADAPTER_ROOT: /data/adapters
    volumes:
      - model_hf_cache:/data/hf-cache
      - ./adapters:/data/adapters
      - ./models:/models:ro
      - ./models.txt:/workspace/models.txt:ro
    gpus: all
    shm_size: "2gb"
    restart: unless-stopped

  clean-model:
    build: .
    command: ["uvicorn", "app.clean_server:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    ports:
      - "8001:8001"
    environment:
      HF_HOME: /data/hf-cache
    volumes:
      - model_hf_cache:/data/hf-cache
      - ./models:/models:ro
      - ./models.txt:/workspace/models.txt:ro
    gpus: all
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  model_hf_cache:
